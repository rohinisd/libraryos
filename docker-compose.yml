services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: libraryos
      POSTGRES_PASSWORD: libraryos
      POSTGRES_DB: libraryos
    ports:
      - "5432:5432"
    volumes:
      - libraryos_pgdata:/var/lib/postgresql/data

volumes:
  libraryos_pgdata:
