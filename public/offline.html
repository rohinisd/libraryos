<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3B4FD8" />
    <title>LibraryOS — Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F5F6FA; font-family: system-ui, sans-serif; color: #0D0D1A; }
      main { max-width: 360px; padding: 32px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { color: #6B7280; font-size: 14px; line-height: 1.5; }
      button { margin-top: 20px; border: 0; border-radius: 999px; background: #3B4FD8; color: #fff; padding: 12px 28px; font-weight: 700; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="LibraryOS" />
      <h1>You&rsquo;re offline</h1>
      <p>LibraryOS needs an internet connection to show your students, seats and payments. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
